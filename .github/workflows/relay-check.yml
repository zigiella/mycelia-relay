name: Relay check

# Materializa los checks que .relay.yml declara y que se pueden comprobar sin humano.
# Avisa por defecto; pon STRICT=1 (abajo) cuando el equipo quiera que bloquee.
#
# Desde 0.7 este fichero es el que corrio de verdad en convoca: los tres arreglos de
# abajo los hizo Trazo alli (encargo #351, PR #353 de convoca, 2026-11-16) y Clara los
# midio. Hasta 0.6.2 este check se habia ejecutado casi siempre "fuera de alcance", y
# por eso sus defectos no se habian visto nunca.
#
# Si tu proyecto lleva una COPIA de este fichero anterior a 0.7, no tiene estos arreglos:
# sustituyela entera, no la parchees.

on:
  pull_request:
    # `labeled`: si la etiqueta se pone DESPUES de abrir el PR, tambien lanza el check.
    # Hasta 0.6.2 no estaba, y un PR etiquetado tarde no se comprobaba hasta el siguiente push.
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled]

# Un commit nuevo al mismo PR cancela el run anterior que siga en curso: solo se comprueba
# el ultimo, que lleva todo. Ahorra minutos sin perder cobertura.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  contrato:
    runs-on: ubuntu-latest
    # Solo los PR que cruzan entornos o cambian de manos (por etiqueta), y no en borrador.
    # Hasta 0.6.2 el filtro era un `case` DENTRO del script: el runner arrancaba y se cobraba
    # el minuto entero aunque luego saliera "fuera de alcance". En convoca, 187 veces en 17
    # dias. Con el `if:` a nivel de job, un PR sin estas etiquetas sale `skipped` sin arrancar
    # nada, y un job saltado no se cobra.
    if: >-
      github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.labels.*.name, 'relevo') ||
       contains(github.event.pull_request.labels.*.name, 'working-cloud') ||
       contains(github.event.pull_request.labels.*.name, 'paused-local'))
    env:
      STRICT: "0"
    steps:
      # Sin `actions/checkout`: el check solo lee el cuerpo del PR, que llega con el evento.
      - name: Comprueba el cuerpo del PR
        # El cuerpo llega por env: queda como dato en $BODY y no se interpola en el script.
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          avisos=0
          aviso() { echo "::warning::$1"; avisos=$((avisos+1)); }

          # El check lee los CUATRO apartados de la plantilla por su encabezado, y mira su
          # CONTENIDO. Hasta 0.6.2 buscaba palabras sueltas por todo el cuerpo, y la plantilla
          # SIN RELLENAR pasaba tres de las cuatro comprobaciones: sus etiquetas vacias de
          # Evidencia contaban como contenido, traia escritas las clases de datos, y su
          # encabezado "Handoff o pendientes" ya contenia la palabra buscada. Validaba el
          # andamiaje, no el PR: la misma cicatriz que el data_map vacio de 0.5.
          #
          # Lo que va entre <!-- y --> es guia de la plantilla y no cuenta, y una linea que es
          # solo una etiqueta ("- Comprobado con:") tampoco. Cada apartado se lee hasta el
          # encabezado siguiente O HASTA EL FINAL: hasta 0.6.2, si Evidencia era el ultimo,
          # se perdia su ultima linea y un PR de una linea avisaba en falso.
          sin_comentarios() {
            printf '%s\n' "$BODY" | tr -d '\r' | awk '
              { linea = $0; limpia = ""
                while (linea != "") {
                  if (encom) {
                    p = index(linea, "-->")
                    if (p == 0) linea = ""; else { linea = substr(linea, p + 3); encom = 0 }
                  } else {
                    p = index(linea, "<!--")
                    if (p == 0) { limpia = limpia linea; linea = "" }
                    else { limpia = limpia substr(linea, 1, p - 1); linea = substr(linea, p + 4); encom = 1 }
                  }
                }
                print limpia }'
          }
          seccion() {      # contenido de los apartados cuyo encabezado casa con $1
            sin_comentarios | awk -v pat="$1" '
              /^[ \t]*#+[ \t]/ { dentro = (tolower($0) ~ pat); next }
              dentro && $0 !~ /^[ \t]*([-*][ \t]+)?[^:]+:[ \t]*$/ { print }'
          }
          hay_seccion() {
            sin_comentarios | awk -v pat="$1" '/^[ \t]*#+[ \t]/ && tolower($0) ~ pat { f = 1 } END { exit !f }'
          }
          fuera_de_encabezados() { sin_comentarios | grep -v '^[[:space:]]*#' || true; }

          # 1. Enlaza un issue: un #N en cualquier parte (Closes #N, "Seguimiento: #N"...).
          sin_comentarios | grep -Eq '#[0-9]+' \
            || aviso "El PR no enlaza ningun issue: en Relay el issue es el contrato."

          # 2. Evidencia, con contenido de verdad.
          EV=$(seccion 'evidencia' | tr -d '[:space:]')
          [ -n "$EV" ] || aviso "La seccion Evidencia esta vacia: declara que comprobaste y que no."

          # 3. Clase de datos, dentro de su apartado ("Clase de datos"; "Politica de datos" en
          #    plantillas anteriores a 0.7). Sin apartado, en cualquier linea que no sea encabezado.
          #    El MENU de opciones ("repository | cloud-ok | ...") que traian la plantilla de
          #    0.6.2 y el bloque HANDOFF sin rellenar no es una respuesta: no cuenta.
          if hay_seccion 'de datos'; then CL=$(seccion 'de datos'); else CL=$(fuera_de_encabezados); fi
          printf '%s\n' "$CL" | grep -Eiv 'repository *\| *cloud-ok' \
            | grep -Eqi 'repository|cloud-ok|local-only|synthetic-only' \
            || aviso "No se declara la clase de datos utilizada."

          # 4. Pendientes o relevo, con contenido ("Pendientes"; "Handoff o pendientes" antes de
          #    0.7). Sin apartado, la palabra en una linea que no sea encabezado.
          if hay_seccion 'pendiente|handoff'; then
            PE=$(seccion 'pendiente|handoff' | tr -d '[:space:]')
          else
            PE=$(fuera_de_encabezados | grep -Ei 'handoff|pendiente' || true)
          fi
          [ -n "$PE" ] || aviso "Sin pendientes ni relevo: si la tarea continua, la siguiente agente no sabra por donde."

          if [ "$avisos" -gt 0 ]; then
            echo "$avisos aviso(s) de contrato Relay."
            # STRICT=0 avisa y NO bloquea. Hasta 0.6.2 esta linea era `[ ... ] && exit 1`:
            # con STRICT=0, la comprobacion devolvia 1, y como era la ultima orden del script,
            # el job salia en rojo -- justo lo contrario de avisar. Nadie lo vio en este repo
            # porque sus PR no tenian avisos; salio en la primera pasada real en convoca.
            if [ "$STRICT" = "1" ]; then exit 1; fi
          else
            echo "Contrato Relay: PR completo."
          fi
