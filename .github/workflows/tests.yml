name: Tests

# Existe por la regla de datapoble: una guarda que no has visto caer no es una guarda.
# Hasta 0.5 nuestro validador daba verde con el data_map vacio y nadie lo habia visto
# fallar nunca. Ahora cada guarda se prueba en negativo en cada push.
#
# OPCIONAL PERO PORTABLE. Hasta 0.6.1 esta cabecera decia "este fichero se queda aqui",
# y era verdad por un defecto: test_validate_config fallaba siempre en un anfitrion
# porque comprobaba que `.relay.yml` estuviera en rojo, y alli esa es la configuracion
# real del proyecto. Lo arreglo datapoble al ser el primer anfitrion que lo corrio.
# Ahora si viaja: un equipo que copie scripts/validate_config.py puede copiar tambien
# scripts/test_validate_config.py y este workflow, y tendra la prueba de que SU copia
# hace lo que dice. El caso que solo aplica aqui se declara "skip" en voz alta.
#
# Si copias este workflow, copia tambien el script: sin el, la CI queda en rojo.
#
# Desde 0.7, solo corre cuando cambia lo que prueba (filtro `paths`): el validador y su
# configuracion, el check y la plantilla que el check lee. Hasta 0.6.2 corria en cada push:
# en convoca, 299 ejecuciones en 17 dias para 3 cambios de lo que prueba, en un repositorio
# privado que ya se habia quedado sin minutos una vez. Arreglo de Trazo en convoca (PR #353),
# medido por Clara.

on:
  push:
    branches: [main]
    paths:
      - ".relay.yml"
      - "scripts/validate_config.py"
      - "scripts/test_validate_config.py"
      - ".github/workflows/tests.yml"
      - ".github/workflows/relay-check.yml"
      - ".github/pull_request_template.md"
      - "scripts/test_relay_check.py"
  pull_request:
    paths:
      - ".relay.yml"
      - "scripts/validate_config.py"
      - "scripts/test_validate_config.py"
      - ".github/workflows/tests.yml"
      - ".github/workflows/relay-check.yml"
      - ".github/pull_request_template.md"
      - "scripts/test_relay_check.py"

# Un commit nuevo a la misma rama o PR cancela el run anterior que siga en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Cada guarda del validador, vista caer
        run: python scripts/test_validate_config.py
      # Desde 0.7 el check tambien tiene pruebas. Hasta entonces no tenia ninguna, y por eso
      # dos defectos vivieron meses: STRICT=0 tumbaba el job, y la ultima linea de Evidencia
      # se perdia. Y la plantilla sin rellenar pasaba tres de las cuatro comprobaciones.
      - name: El check, visto caer
        run: python scripts/test_relay_check.py
